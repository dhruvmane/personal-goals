spring:
  datasource:
    url: jdbc:h2:mem:personalgoals;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: test-only-secret-key-at-least-32-characters-long
  expires-in: PT1H
  refresh-expires-in: P30D
  issuer: personal-goals-api

cors:
  allowed-origins: http://localhost:4321
