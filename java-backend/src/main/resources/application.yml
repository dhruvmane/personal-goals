spring:
  application:
    name: personal-goals-api

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/neondb?sslmode=disable}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:}
  expires-in: ${JWT_EXPIRES_IN:PT12H}
  refresh-expires-in: ${JWT_REFRESH_EXPIRES_IN:P30D}
  issuer: ${JWT_ISSUER:personal-goals-api}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4321}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    com.personalgoals: INFO
